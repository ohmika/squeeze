<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net">
<title>Squeeze — code minify &amp; prettify</title>
<style>
:root{--bg:#0e1411;--card:#151d19;--sec:#1e2823;--bd:#2a352f;--fg:#e9eee6;--mut:#8fa096;--pri:#b8f13f;--on:#0e1411;--err:#ff7a70;--r:12px;

*{box-sizing:border-box;margin:0}

#src{height:12rem}

</section>
</main>

<script>
(()=>{
'use strict';
/*CORE*/
// ───────── JavaScript ─────────
const KW=new Set(['return','typeof','instanceof','in','of','new','delete','void','throw','case','do','else','yield','await']);
const CTRL=new Set([...KW,'if','for','while','switch','catch','with']);
const OBJW=new Set(['return','yield','await','in','of','typeof','void','delete','case','default']);
const RE_WS=/\s+/y,RE_W=/[\w$\u0080-\uffff]+/y,RE_F=/[a-z]*/y;

function tokJS(s){

  const rx=re=>{re.lastIndex=i;const m=re.exec(s);return m&&m[0]};
  const add=(t,v)=>{const k={t,v};T.push(k);if(t!=='ws'&&t!=='com')prev=k;i+=v.length};

    const c=s[i],d=s[i+1];let v;

    else if(c==='/'&&d==='/'){const j=s.indexOf('\n',i);add('com',s.slice(i,j<0?n:j))}

    else if((/\d/.test(c)||(c==='.'&&/\d/.test(d)))&&(v=rx(RE_N)))add('w',v);
    else if((v=rx(RE_W)))add('w',v);
    else add('p',rx(RE_P));

}
const nlCount=v=>(v.match(/\n/g)||[]).length;

// Significant tokens with newline/space info, comment filtering, console removal and spacing flags
function prep(src,o){
  const S=[];let nl=0,sp=false;
  for(const k of tokJS(src)){
    if(k.t==='ws'){nl+=nlCount(k.v);sp=true;continue}
    if(k.t==='com'&&o.comments&&!(o.license&&/^\/\*!|@license|@preserve/.test(k.v))){nl+=nlCount(k.v);sp=true;continue}
    k.nl=nl;k.sp=sp;nl=0;sp=false;S.push(k);

  return S;
}
function dropConsole(S){
  for(let i=0;i<S.length;i++){
    const k=S[i],pv=S[i-1];
    if(!(k.t==='w'&&k.v==='console'&&S[i+1]?.v==='.'&&S[i+2]?.t==='w'&&S[i+3]?.v==='('))continue;
    if(pv&&pv.t==='p'&&pv.v==='.')continue;

    if(d)continue;

}
function flag(S){
  const cn=[0];let p=null;
  for(const k of S){
    if(k.t==='com')continue;
    if(k.t==='p'){
      const v=k.v;
      if(v==='+'||v==='-'||v==='++'||v==='--'){
        const operand=p&&((p.t==='p'&&(p.v===')'||p.v===']'))||(p.t!=='p'&&!(p.t==='w'&&KW.has(p.v))));
        k.u=!operand;

// A newline may be dropped only when the parse is identical without it (no ASI hazard)

  if(A==='w'&&/^\d+$/.test(a.v)&&B==='p'&&b.v==='.')return true;
  if(A==='p'&&B==='p'){const x=a.v.slice(-1),y=b.v[0];if((x==='+'||x==='-')&&x===y)return true;if(x==='/'&&(y==='/'||y==='*'))return true}

const NOSP_BEFORE=/^(,|;|\)|\]|\.|\?\.)$/,NOSP_AFTER=/^(\(|\[|\.|\?\.|!|~|#|\.\.\.)$/;

    if(p.v===')'||p.v===']')return !(k.t==='p'&&(k.v==='('||k.v==='['));
    if(p.v==='}')return !(k.t==='p'&&k.v==='(');

    if(k.v==='('||k.v==='[')return p.t==='w'&&CTRL.has(p.v);

const stay=n=>!!n&&((n.t==='p'&&/^(\)|\]|,|;|\.|\?\.|:|\?)$/.test(n.v))||(n.t==='w'&&/^(else|catch|finally|while)$/.test(n.v)));

// ───────── CSS ─────────
function cssTok(s){

const keepC=(v,o)=>!o.comments||(o.license&&/^\/\*[!@]/.test(v));
function minCSS(s,o){

// ───────── HTML ─────────
const BLOCK=/^(address|article|aside|audio|base|blockquote|body|br|canvas|caption|col|colgroup|dd|details|dialog|div|dl|dt|fieldset|figcaption|figure|footer|form|h[1-6]|head|header|hgroup|hr|html|iframe|li|link|main|menu|meta|nav|noscript|ol|optgroup|option|p|pre|script|section|select|source|style|summary|table|tbody|td|template|tfoot|th|thead|title|tr|track|ul|video)$/;

const HT=/<!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>|<(script|style|pre|textarea)\b(?:"[^"]*"|'[^']*'|[^'">])*>[\s\S]*?<\/\1\s*>|<(?:"[^"]*"|'[^']*'|[^'">])*>|<|[^<]+/gi;

  try{
    if(tok.nm==='script'&&(!ty||/javascript|module|ecmascript/i.test(ty)))r.inner=mode==='min'?minJS(r.inner,jo):prettyJS(r.inner,jo);
    else if(tok.nm==='style'&&(!ty||/text\/css/i.test(ty)))r.inner=mode==='min'?minCSS(r.inner,jo):prettyCSS(r.inner,jo);
    else r.inner=r.inner.trim();
  }catch(e){r.inner=r.inner.trim()}
  return r;
}
function minHTML(s,o){
  const L=[];
  for(const tok of htokens(s)){
    if(tok.k==='com'&&dropCom(tok,o))continue;
    if(tok.k==='txt'){
      const t=tok.t.replace(/\s+/g,' '),last=L[L.length-1];
      if(last&&last.k==='txt')last.t+=t;else L.push({k:'txt',t});
      continue;
    }
    if(tok.k==='raw'&&tok.nm!=='pre'&&tok.nm!=='textarea'){const r=inlineCode(tok,'min',o);tok.t=r.open+r.inner+r.close}
    else if(tok.k==='open'||tok.k==='close'||tok.k==='misc')tok.t=tagFix(tok.t);
    L.push(tok);
  }
  const edge=x=>!x||x.blk||x.k==='misc'||x.k==='com';
  return L.map((x,i)=>{
    if(x.k!=='txt')return x.t;
    let t=x.t;
    if(edge(L[i-1]))t=t.trimStart();
    if(edge(L[i+1]))t=t.trimEnd();
    return t;
  }).join('').trim();
}
function prettyHTML(s,o){
  const T=htokens(s),out=[];let ln='',d=0;
  const ind=()=>'  '.repeat(d);
  const flush=()=>{if(ln.trim())out.push(ind()+ln.trim());ln=''};
  const push=t=>{flush();out.push(ind()+t)};
  for(let i=0;i<T.length;i++){
    const tok=T[i];
    if(tok.k==='com'){if(!dropCom(tok,o))push(tok.t.trim());continue}
    if(tok.k==='misc'){push(tok.t);continue}
    if(tok.k==='txt'){ln+=tok.t.replace(/\s+/g,' ');continue}
    if(tok.k==='raw'){
      if(tok.nm==='textarea'){ln+=tok.t;continue}
      if(tok.nm==='pre'){push(tok.t);continue}
      const r=inlineCode(tok,'pretty',o);
      flush();
      if(!r.inner)out.push(ind()+r.open+r.close);
      else{out.push(ind()+r.open);for(const l of r.inner.split('\n'))out.push(l?ind()+'  '+l:'');out.push(ind()+r.close)}
      continue;
    }
    const tag=tagFix(tok.t);
    if(!tok.blk){ln+=tag;continue}
    if(tok.k==='close'){flush();d=Math.max(0,d-1);out.push(ind()+tag);continue}
    if(!tok.vd){                                   // <li>short inline content</li> stays on one line
      let j=i+1;
      while(j<T.length&&(T[j].k==='txt'||(T[j].blk===false&&T[j].k!=='com'&&T[j].k!=='misc')))j++;
      if(T[j]&&T[j].k==='close'&&T[j].nm===tok.nm){
        const body=T.slice(i+1,j).map(x=>x.k==='txt'?x.t.replace(/\s+/g,' '):x.k==='raw'?x.t:tagFix(x.t)).join('').trim();
        if(body.length<100){push(tag+body+tagFix(T[j].t));i=j;continue}
      }
    }
    push(tag);
    if(!tok.vd)d++;
  }
  flush();
  return out.join('\n');
}

// ───────── Dispatcher & detection ─────────
function transform(src,lang,op,o){
  src=src.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const min=op==='minify';
  if(lang==='json')return JSON.stringify(JSON.parse(src),null,min?0:2);
  if(lang==='css')return min?minCSS(src,o):prettyCSS(src,o);
  if(lang==='html')return min?minHTML(src,o):prettyHTML(src,o);
  return min?minJS(src,o):prettyJS(src,o);
}
function detect(s){
  const t=s.trim();
  if(!t)return null;
  if(/^[{[]/.test(t)){try{JSON.parse(t);return 'json'}catch(e){}}
  if(/^<(!doctype|[a-z!])/i.test(t))return 'html';
  if(/^@(import|media|charset|font-face|keyframes|layer|supports|namespace|page|property)\b/.test(t))return 'css';
  if(/^[^{}=;]*\{\s*[\w-]+\s*:[^{}]*\}/.test(t)&&!/\b(function|const|let|var|return|if|for|while|else|class|switch|try)\b|=>/.test(t.slice(0,200)))return 'css';
  return 'js';
}
/*END*/

// ───────── UI ─────────
const $=s=>document.querySelector(s);
const el={src:$('#src'),out:$('#out'),res:$('#res'),err:$('#err'),run:$('#run'),stat:$('#stat'),chips:$('#chips'),copy:$('#copy'),info:$('#inInfo'),note:$('#note')};
const st={lang:'js',op:'pretty',manual:false,ran:false};
const opts={comments:true,license:true,console:false,single:false,nosemi:false,tabs:false,wide:false};
const CH={comments:'Remove comments',license:'Keep /*! license */',console:'Remove console.*',single:'Single quotes',nosemi:'No semicolons',tabs:'Use tabs',wide:'100 columns'};
const SETS={
  pretty:{js:['single','nosemi','tabs','wide'],css:['single','tabs','wide'],html:['single','tabs','wide'],json:['tabs','wide']},
  minify:{js:['comments','license','console'],css:['comments','license'],html:['comments'],json:[]}
};
const HINT={js:'// Paste your JavaScript here',css:'/* Paste your CSS here */',html:'<!-- Paste your HTML here -->',json:'{ "paste": "your JSON here" }'};
const bytes=s=>new TextEncoder().encode(s).length;
const fmtB=n=>n<1024?n+' B':(n/1024).toFixed(1)+' KB';

function renderChips(){
  el.chips.textContent='';
  const set=SETS[st.op==='pretty'?'pretty':'minify'][st.lang];
  if(!set.length){const s=document.createElement('span');s.className='tag';s.textContent='No options for this mode.';el.chips.append(s);return}
  for(const k of set){const label=CH[k];
    const b=document.createElement('button');
    b.type='button';b.className='chip';b.dataset.k=k;b.textContent=label;b.setAttribute('aria-pressed',String(opts[k]));
    el.chips.append(b);
  }
}
function syncSeg(id,v){$(id).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)))}
function update(){
  const v=el.src.value;
  el.run.disabled=!v.trim();
  el.run.textContent=(st.op==='pretty'?'Prettify':'Minify')+' →';
  el.info.textContent=v?'input · '+fmtB(bytes(v)):'input';
}
// Prettier (official standalone build) is loaded lazily from jsDelivr on first use
const PV='3.4.2',CDN='https://cdn.jsdelivr.net/npm/prettier@'+PV+'/';
let pLoad=null;
const loadScript=u=>new Promise((ok,no)=>{
  const s=document.createElement('script');
  s.src=u;s.async=false;s.onload=ok;
  s.onerror=()=>{const e=new Error('Could not load '+u);e.loadFailed=true;no(e)};
  document.head.append(s);
});
function loadPrettier(){
  if(!pLoad)pLoad=(async()=>{
    await loadScript(CDN+'standalone.js');
    await Promise.all(['babel','estree','postcss','html'].map(n=>loadScript(CDN+'plugins/'+n+'.js')));
    if(!window.prettier||!window.prettierPlugins){const e=new Error('Prettier did not initialize');e.loadFailed=true;throw e}
  })().catch(e=>{pLoad=null;throw e});
  return pLoad;
}
async function prettierFormat(code,lang){
  await loadPrettier();
  const P=window.prettierPlugins;
  return window.prettier.format(code.replace(/\r\n?/g,'\n'),{
    parser:{js:'babel',css:'css',html:'html',json:'json'}[lang],
    plugins:[P.babel,P.estree,P.postcss,P.html],
    printWidth:opts.wide?100:80,useTabs:opts.tabs,semi:!opts.nosemi,singleQuote:opts.single
  });
}
let job=0;
async function process(){
  const code=el.src.value;
  if(!code.trim())return;
  const id=++job;let engine='';
  el.err.textContent='';el.note.textContent='';
  try{
    let r;
    if(st.op==='pretty'){
      el.run.disabled=true;el.run.textContent='Formatting…';
      try{r=await prettierFormat(code,st.lang);engine='Prettier '+PV}
      catch(e){
        if(!e.loadFailed)throw e;
        r=transform(code,st.lang,'pretty',{comments:false,license:true,blank:false,console:false});
        engine='built-in formatter';
        if(id===job)el.note.textContent='Prettier could not be loaded (offline or blocked), so the built-in formatter was used.';
      }
    }else r=transform(code,st.lang,'minify',opts);
    if(id!==job)return;
    const a=bytes(code),b=bytes(r),pct=a?Math.round((b-a)/a*100):0;
    el.out.value=r;el.res.hidden=false;st.ran=true;
    el.stat.textContent=fmtB(a)+' → '+fmtB(b)+' ('+(pct>0?'+':pct<0?'−':'')+Math.abs(pct)+'%)'+(engine?' · '+engine:'');
  }catch(e){
    if(id!==job)return;
    el.err.textContent='Could not process: '+(e&&e.message||e);el.res.hidden=true;
  }finally{
    if(id===job)update();
  }
}
const rerun=()=>{if(st.ran&&el.src.value.trim())process()};
function setLang(v,manual){
  st.lang=v;if(manual)st.manual=true;
  syncSeg('#lang',v);el.src.placeholder=HINT[v];renderChips();rerun();
}
function autoDetect(){
  if(st.manual)return;
  const d=detect(el.src.value);
  if(d&&d!==st.lang)setLang(d,false);
}
function onSeg(id,fn){
  $(id).addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)fn(b.dataset.v)});
}
onSeg('#lang',v=>setLang(v,true));
onSeg('#op',v=>{st.op=v;syncSeg('#op',v);update();renderChips();rerun()});
el.chips.addEventListener('click',e=>{
  const b=e.target.closest('button[data-k]');if(!b)return;
  const k=b.dataset.k;opts[k]=!opts[k];b.setAttribute('aria-pressed',String(opts[k]));rerun();
});
el.src.addEventListener('input',update);
el.src.addEventListener('paste',()=>setTimeout(()=>{update();autoDetect()}));
el.src.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();if(!el.run.disabled)process()}});
el.run.addEventListener('click',process);
$('#clear').addEventListener('click',()=>{
  el.src.value='';el.out.value='';el.res.hidden=true;el.err.textContent='';st.ran=false;st.manual=false;update();el.src.focus();
});
$('#paste').addEventListener('click',async()=>{
  try{
    el.src.value=await navigator.clipboard.readText();update();autoDetect();el.src.focus();el.err.textContent='';
  }catch(e){
    el.src.focus();el.err.textContent='Clipboard access is blocked. Use ⌘V or Ctrl+V to paste.';
  }
});
let copyTimer=0;
el.copy.addEventListener('click',async()=>{
  let ok=true;
  try{await navigator.clipboard.writeText(el.out.value)}
  catch(e){el.out.select();try{ok=document.execCommand('copy')}catch(_){ok=false}}
  el.copy.textContent=ok?'Copied ✓':'Press ⌘C / Ctrl+C';
  clearTimeout(copyTimer);copyTimer=setTimeout(()=>{el.copy.textContent='Copy'},1600);
});
el.src.placeholder=HINT.js;
renderChips();update();
})();
</script>
</body>
</html>
