function prettyCode(s){s=scan(s,opts.comments);let out='',i=0,q='',depth=0,line='';const flush=()=>{let t=line.trim();if(t){out+='  '.repeat(Math.max(0,depth))+t+'\n';line=''}};while(i<s.length){let c=s[i];if(q){line+=c;if(c==='\\'&&i+1<s.length)line+=s[++i];else if(c===q)q='';i++;continue}if(c === '"' || c === "'" || c === '`'){q=c;line+=c;i++;continue}if(c==='{' ){if(line.trim())line+=' ';line+='{';flush();depth++;i++;while(i<s.length&&/\s/.test(s[i]))i++;continue}if(c==='}'){flush();depth=Math.max(0,depth-1);line='}';if(s[i+1]!==';'&&s[i+1]!==','&&s[i+1]!==')')flush();i++;continue}if(c===';'){line+=';';flush();i++;continue}if(c===','){line+=', ';i++;while(s[i]===' ')i++;continue}if(/\s/.test(c)){let j=i;while(j<s.length&&/\s/.test(s[j]))j++;if(line&&/[\w$)]/.test(line.at(-1))&&/[\w$]/.test(s[j]||''))line+=' ';i=j;continue}line+=c;i++}flush();return out.trim()}
function cssFormat(s){s=scan(s,opts.comments).replace(/\s+/g,' ').trim();if(op==='minify')return s.replace(/\s*([{}:;,>+~])\s*/g,'$1').replace(/;}/g,'}').replace(/\s+/g,' ');let out='',d=0,buf='';for(const c of s){if(c==='{'){out+='  '.repeat(d)+buf.trim()+' {\n';buf='';d++}else if(c===';'){out+='  '.repeat(d)+buf.trim()+';\n';buf=''}else if(c==='}'){if(buf.trim())out+='  '.repeat(d)+buf.trim()+'\n';buf='';d=Math.max(0,d-1);out+='  '.repeat(d)+'}\n'}else buf+=c}return out.trim()}
function htmlFormat(s){if(op==='minify')return s.replace(/<!--[\s\S]*?-->/g,opts.comments?'':'$&').replace(/>\s+</g,'><').trim();let tokens=s.replace(/<!--[\s\S]*?-->/g,opts.comments?'':'$&').match(/<[^>]+>|[^<]+/g)||[],out='',d=0;for(let t of tokens){t=t.trim();if(!t)continue;if(/^<\//.test(t))d=Math.max(0,d-1);out+='  '.repeat(d)+t+'\n';if(/^<(?![!?/])[^>]+>$/.test(t)&&!/^<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)\b/i.test(t)&&!t.endsWith('/>'))d++}return out.trim()}
function stripConsole(s){return s.replace(/console\.[A-Za-z_$][\w$]*\s*\([^;]*\)\s*;?/g,'')}
function process(){try{let s=input.value;if(opts.blank)s=s.replace(/\n[\t ]*\n/g,'\n');if(opts.console&&lang==='js')s=stripConsole(s);if(lang==='json'){const v=JSON.parse(s);s=JSON.stringify(v,null,op==='pretty'?2:0)}else if(lang==='css')s=cssFormat(s);else if(lang==='html')s=htmlFormat(s);else s=op==='pretty'?prettyCode(s):minifyCode(s);$('#error').textContent='';output.value=s;result.style.display='block';$('#status').textContent=s.length.toLocaleString('en-US')+' tekens';return true}catch(e){$('#error').textContent='Could not process: '+e.message;result.style.display='none';return false}}
